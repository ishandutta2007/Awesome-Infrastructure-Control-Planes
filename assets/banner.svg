<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
    /* <![CDATA[ */
.text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }

      /* Animated background circles and laser pulses */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .glow-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 1000px 250px;
        animation: pulseGlow 10s ease-in-out infinite reverse;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
      .active-beam {
        stroke-dasharray: 80, 200;
        animation: beamMove 14s linear infinite;
      }
      .radar-sweep-line {
        transform-origin: 1050px 90px;
        animation: radarSweep 12s linear infinite;
      }
    /* ]]> */
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Behind Everything) -->
  <circle class="glow-orb-1" cx="200" cy="100" r="180" fill="url(#glowGrad)" />
  <circle class="glow-orb-2" cx="1000" cy="250" r="220" fill="url(#glowGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="360" fill="url(#gridPattern)" />

  <!-- Background Animated Network / Control Plane Flow Lines -->
  <g opacity="0.45">
    <path d="M 0 60 Q 300 120 600 60 T 1200 80" fill="none" stroke="#334155" stroke-width="1.5" />
    <path class="active-beam" d="M 0 60 Q 300 120 600 60 T 1200 80" fill="none" stroke="#38bdf8" stroke-width="2.5" />

    <path d="M 0 300 Q 400 220 800 290 T 1200 240" fill="none" stroke="#334155" stroke-width="1.5" />
    <path class="active-beam" d="M 0 300 Q 400 220 800 290 T 1200 240" fill="none" stroke="#a855f7" stroke-width="2.5" />

    <!-- Radar / Control Plane Node Graphic in Top Right (Background) -->
    <g transform="translate(1050, 90)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="15" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <line class="radar-sweep-line" x1="0" y1="0" x2="45" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    </g>

    <!-- Floating Data Particles -->
    <circle class="particle-1" cx="140" cy="80" r="3" fill="#38bdf8" />
    <circle class="particle-2" cx="320" cy="280" r="2.5" fill="#818cf8" />
    <circle class="particle-3" cx="880" cy="70" r="3" fill="#c084fc" />
    <circle class="particle-1" cx="1120" cy="270" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Subtle Top Decorative Banner Border Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primaryGrad)" />

  <!-- FOREGROUND CONTENT: Safe from any animated clutter -->
  <!-- Top Category Tag -->
  <g transform="translate(60, 52)">
    <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text x="30" y="20" class="badge-text" fill="#38bdf8">INFRASTRUCTURE CONTROL PLANES</text>
  </g>

  <!-- Main Banner Title (Always Foreground) -->
  <text x="60" y="145" class="text-title" fill="url(#primaryGrad)">
    Awesome Infrastructure Control Planes
  </text>

  <!-- Subtitle -->
  <text x="60" y="195" class="text-subtitle">
    Curated Control Planes, Continuous Reconciliation &amp; Declarative IaC Orchestration
  </text>

  <!-- Interactive/Feature Pills (Foreground) -->
  <g transform="translate(60, 240)">
    <!-- Pill 1: IaC Orchestration -->
    <g transform="translate(0, 0)">
      <rect width="190" height="38" rx="8" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" class="badge-text" fill="#e2e8f0">⚡ IaC Orchestration</text>
    </g>

    <!-- Pill 2: Continuous Reconciliation -->
    <g transform="translate(205, 0)">
      <rect width="235" height="38" rx="8" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" class="badge-text" fill="#e2e8f0">🔄 Continuous Reconciliation</text>
    </g>

    <!-- Pill 3: GitOps and Policy as Code -->
    <g transform="translate(455, 0)">
      <rect width="215" height="38" rx="8" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" class="badge-text" fill="#e2e8f0">🛡️ Policy &amp; Drift Detection</text>
    </g>

    <!-- Pill 4: Open Source and Enterprise SaaS -->
    <g transform="translate(685, 0)">
      <rect width="235" height="38" rx="8" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
      <text x="18" y="24" class="badge-text" fill="#e2e8f0">🚀 Self-Hosted &amp; Managed SaaS</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="60" y1="315" x2="1140" y2="315" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
</svg>
